services:
  minsa-incidencias-backend:
    build: .
    image: minsa-incidencias-backend:latest
    container_name: minsa-incidencias-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3033}:3033"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3033"

      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4010}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3033/salud"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
